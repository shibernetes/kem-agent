image:
  # -- Agent image repository
  repository: ghcr.io/shibernetes/kem-agent
  # -- Image tag. Defaults to the chart's `appVersion`
  tag: ""
  # -- Image digest. When set, the image is pulled as `<repository>:<tag>@<digest>`
  digest: ""
  # -- Image pull policy
  pullPolicy: IfNotPresent

# -- Agent configuration, mounted in the agent pod from a ConfigMap. It must
# declare at least one pipeline. See [Configuration](#configuration) for what
# the chart fills in
# @default -- See values.yaml
config:
  service:
    http_server:
      addr: ":8080"
  source:
    watches: []
    # enrichment:
    #   # Each entry names a resource. Add `clusterScoped: true` to a
    #   # cluster-scoped resource, because Helm can't look up a resource's scope
    #   # and the chart needs it to create the roles.
    #   resources:
    #     - name: deployments.apps
    #     - name: nodes
    #       clusterScoped: true
  checkpoint:
    store:
      type: configmap
  # This example sends every event from the watched namespaces to stdout.
  # sinks:
  #   console:
  #     type: stdout
  # pipelines:
  #   events:
  #     sinks:
  #       - console

# -- Restart the agent pod when `config` changes, using a `checksum/config` pod
# annotation. It has no effect when `config.service.hot_reload` is `true`, so that
# filter changes apply without a restart
restartOnConfigChange: true

# -- Seconds the agent pod has to shut down before it's killed. Set it higher
# than `config.service.shutdown_timeout`, which defaults to `30s`
terminationGracePeriodSeconds: 60

startupProbe:
  # -- How often the startup probe checks `/readyz`, in seconds
  periodSeconds: 5
  # -- Failed startup probes allowed before the container is restarted.
  # `periodSeconds` × `failureThreshold` must be longer than
  # `config.source.enrichment.sync_timeout`, which defaults to `1m`. The
  # defaults allow 90 seconds
  failureThreshold: 18

# -- Security context for the agent pod. The user ID matches the image's
# nonroot user
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# -- Security context for the agent container
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# -- Resource requests and limits for the agent container
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

serviceAccount:
  # -- Create a ServiceAccount for the agent pod
  create: true
  # -- ServiceAccount name. Defaults to the chart's fullname, or to `default`
  # when `create` is `false`
  name: ""
  # -- Annotations for the ServiceAccount
  annotations: {}

rbac:
  # -- Create the roles and role bindings the agent needs, based on `config`.
  # See [RBAC](#rbac)
  create: true

persistence:
  # -- Mount a PersistentVolumeClaim for a `file` checkpoint store or a `file`
  # sink. The chart doesn't rewrite their paths, so point them under `mountPath`
  enabled: false
  # -- Path where the volume is mounted in the agent container
  mountPath: /var/lib/kem-agent
  # -- Existing PersistentVolumeClaim to use instead of creating one
  existingClaim: ""
  # -- Size of the PersistentVolumeClaim the chart creates
  size: 1Gi
  # -- Storage class of the PersistentVolumeClaim. Uses the cluster default
  # when empty
  storageClassName: ""
  # -- Access modes of the PersistentVolumeClaim
  accessModes:
    - ReadWriteOnce

service:
  # -- Annotations for the Service
  annotations: {}

serviceMonitor:
  # -- Create a Prometheus Operator ServiceMonitor that scrapes `/metrics`
  enabled: false
  # -- Scrape interval. Uses the Prometheus default when empty
  interval: 30s
  # -- Scrape timeout. Uses the Prometheus default when empty
  scrapeTimeout: 10s
  # -- Extra labels for the ServiceMonitor, such as the ones your Prometheus
  # uses to select it
  labels: {}

# -- Extra annotations for the agent pod
podAnnotations: {}

# -- Extra labels for the agent pod
podLabels: {}

# -- Secrets for pulling the image from a private registry
imagePullSecrets: []

# -- Priority class for the agent pod
priorityClassName: ""

# -- Extra environment variables for the agent container. When the agent loads
# its configuration, it replaces each `${VAR}` reference in `config` with the
# value of that variable
env: []

# -- ConfigMaps or Secrets to load environment variables from
envFrom: []

# -- Extra volumes for the agent pod. Mount them with `extraVolumeMounts`
extraVolumes: []

# -- Extra volume mounts for the agent container, such as TLS files used by a sink
extraVolumeMounts: []

# -- Node selector for the agent pod
nodeSelector: {}

# -- Tolerations for the agent pod
tolerations: []

# -- Affinity rules for the agent pod
affinity: {}

# -- Extra manifests to deploy with the release, such as custom RBAC resources.
# Entries can be objects or strings. They're rendered with `tpl`, so they can use
# chart values and named templates
extraObjects: []

# -- Override the chart name
nameOverride: ""

# -- Override the fullname used to name every object
fullnameOverride: ""

apiVersion: v1
kind: Service
metadata:
  name: {{ include "kem-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kem-agent.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ include "kem-agent.httpPort" . }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "kem-agent.selectorLabels" . | nindent 4 }}

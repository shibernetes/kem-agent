apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kem-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kem-agent.labels" . | nindent 4 }}
spec:
  replicas: 1
  # The old pod needs to stop before its replacement starts, so the final
  # checkpoint save lands before the new pod resumes from it, and two pods
  # never write to the data volume at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "kem-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kem-agent.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- $checksum := and .Values.restartOnConfigChange (not (dig "service" "hot_reload" false .Values.config)) }}
      {{- if or $checksum .Values.podAnnotations }}
      annotations:
        {{- if $checksum }}
        checksum/config: {{ include "kem-agent.config" . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "kem-agent.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: agent
          image: {{ include "kem-agent.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -c
            - /etc/kem-agent/config.yaml
          ports:
            - name: http
              containerPort: {{ include "kem-agent.httpPort" . }}
              protocol: TCP
            {{- with dig "service" "pprof_server" "addr" "" .Values.config }}
            - name: pprof
              containerPort: {{ include "kem-agent.port" . }}
              protocol: TCP
            {{- end }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # Liveness and readiness start once the startup probe passes,
          # which /readyz does after the informer caches have synced.
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/kem-agent
              readOnly: true
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "kem-agent.fullname" . }}
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ default (include "kem-agent.fullname" .) .Values.persistence.existingClaim }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

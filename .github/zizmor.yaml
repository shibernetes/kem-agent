# yaml-language-server: $schema=https://raw.githubusercontent.com/zizmorcore/zizmor/main/support/zizmor.schema.json
rules:
  # The CI workflow publishes nothing, because its snapshot job doesn't sign
  # or publish. The release job, which does publish, builds without a cache.
  cache-poisoning:
    ignore:
      - ci.yaml
  # The release workflow can't use the $/ form to call ci.yaml, because
  # actionlint rejects it.
  self-repository:
    ignore:
      - release.yaml

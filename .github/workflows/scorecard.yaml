# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Scorecard

# Scorecard publishes results only from the default branch, so the workflow
# doesn't run on pull requests.
on:
  push:
    branches:
      - master
  schedule:
    # Weekly, on Saturdays at 01:30 UTC.
    - cron: "30 1 * * 6"
  workflow_dispatch: {}

# Publishing results rules out workflow-level write permissions, env, and
# defaults.
permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Analysis
    runs-on: ubuntu-latest
    permissions:
      checks: read # Allows Scorecard to see which tests and code scanners ran on each change
      contents: read
      issues: read # Allows Scorecard to see recent issue activity
      pull-requests: read # Allows Scorecard to see whether pull requests are reviewed
      security-events: write # Allows the upload of the results to code scanning
      id-token: write # Allows Scorecard to publish the results shown on the README badge

    # Publishing results limits this job to a short list of actions,
    # and rules out job-level env, defaults, containers, and services.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload the results to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif

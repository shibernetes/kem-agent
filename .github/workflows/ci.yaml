# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: CI

on:
  push:
    branches:
      - master
  pull_request: {}

  # The release workflow calls this workflow, so a release passes the same
  # checks before it builds, signs, and publishes.
  workflow_call: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lets a pull request that changes only files in .github/ skip the costly
  # jobs. A push never skips them, because it would diff the default branch
  # against itself, and the release workflow must always run every job.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # Allows dorny/paths-filter to read the pull request's changeset
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Filter paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # A filter with only negated patterns never matches, so the catch-all
          # pattern comes first and the exclusion narrows it.
          filters: |
            code:
              - '**'
              - '!.github/**'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          # Hashing go.mod as well as go.sum gives the cache a key before the
          # module has any dependency, and a new key when a version changes.
          cache-dependency-path: |
            go.mod
            **/go.sum

      - name: Verify module tidiness
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain -- go.mod go.sum)" ]; then
            git status --short -- go.mod go.sum
            echo "::error title=Module tidiness::The go.mod and go.sum files aren't tidy. Run 'go mod tidy' and commit the result."
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

      - name: Run nilaway
        run: |
          go install go.uber.org/nilaway/cmd/nilaway@v0.0.0-20260808063849-8649a03c818a
          nilaway -include-pkgs=github.com/shibernetes/kem-agent ./...

  hooks:
    name: Hooks
    runs-on: ubuntu-latest
    env:
      # renovate: datasource=github-releases depName=j178/prek extractVersion=^v(?<version>.+)$
      PREK_CLI_VERSION: 0.5.2
      # Skips the gitleaks hook, because the Secrets job scans the whole history.
      SKIP: gitleaks
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            **/go.sum

      # Runs every hook in .pre-commit-config.yaml over the whole tree, the
      # same checks that run on a local commit. A hook that modifies a file
      # fails the job, which is how the CI catches a stale config schema.
      - name: Run hooks
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          prek-version: ${{ env.PREK_CLI_VERSION }}

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    env:
      # renovate: datasource=github-releases depName=gitleaks/gitleaks
      GITLEAKS_VERSION: v8.30.1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetches the whole history, so the scan also finds a secret that was
          # committed without the hook.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Scan
        run: |
          git log --all --max-count=1 --format=%H
          go install "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}"
          gitleaks git --redact --verbose

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            **/go.sum

      - name: Run unit tests
        run: go test -race -count=1 ./...

      - name: Run allocation tests
        run: go test -count=1 -run DoesNotAllocate ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            **/go.sum

      - name: Build
        run: go build ./...

  chart:
    name: Chart
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    env:
      # renovate: datasource=github-releases depName=helm/helm
      HELM_VERSION: v4.3.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      # The default values declare no pipeline, so each file under ci/ declares
      # one and turns on a different set of optional templates. Lint skips the
      # chart's own fail and required checks, so the job also renders each file.
      - name: Lint and render
        run: |
          helm lint --strict deploy/chart
          for values in deploy/chart/ci/*.values.yaml; do
            helm lint --strict deploy/chart --values "$values"
            helm template kem-agent deploy/chart --values "$values" >/dev/null
          done

  snapshot:
    name: Release snapshot
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    env:
      # renovate: datasource=github-releases depName=goreleaser/goreleaser
      GORELEASER_VERSION: v2.18.1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetches the full history and tags, which goreleaser needs.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            **/go.sum

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # A snapshot builds the archives and one local image per platform,
      # but doesn't sign or publish anything.
      - name: Build release snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --clean --skip=sign

      # A renamed package or variable silently breaks the -X flags, and no test
      # can catch it. The check runs here because the release workflow calls
      # this workflow before it publishes anything.
      - name: Verify version stamping
        run: |
          bin=$(jq -r '.[] | select(.type == "Binary" and .goos == "linux" and .goarch == "amd64") | .path' dist/artifacts.json)
          tag=$(jq -r .tag dist/metadata.json)
          commit=$(jq -r .commit dist/metadata.json)
          out=$("$bin" version)
          echo "$out"
          if ! grep -q " has version ${tag} built " <<<"$out" || ! grep -q " from ${commit::7} on " <<<"$out"; then
            echo "::error title=Build ldflags::The release binary doesn't report tag ${tag} and commit ${commit::7}. Check the -X flags in .goreleaser.yaml."
            exit 1
          fi

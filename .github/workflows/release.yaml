# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # A release publishes signed artifacts, so it runs only on a valid tag, and
  # only after the tagged commit passes CI. The CI snapshot job also checks the
  # version stamping before anything is published.
  guard:
    name: Guard
    runs-on: ubuntu-latest
    steps:
      - name: Verify the tag
        # Fails sooner and more clearly than goreleaser, which also rejects a
        # tag that isn't SemVer.
        run: |
          if ! grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*))?$' <<<"${GITHUB_REF_NAME}"; then
            echo "::error title=Release tag::The tag ${GITHUB_REF_NAME} isn't a SemVer tag. Use the form vMAJOR.MINOR.PATCH, with an optional pre-release and build metadata."
            exit 1
          fi

  ci:
    name: CI
    needs: guard
    permissions:
      contents: read
      pull-requests: read # Required by the changes job in ci.yaml
    uses: ./.github/workflows/ci.yaml

  release:
    name: Release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows goreleaser to create the GitHub release
      packages: write # Allows goreleaser to push the images to ghcr.io
      id-token: write # Lets cosign sign keylessly with this workflow's OIDC token
    env:
      # renovate: datasource=github-releases depName=goreleaser/goreleaser
      GORELEASER_VERSION: v2.18.1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetches the full history and tags, which goreleaser needs.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # The default docker driver can't push a multi-platform image.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  chart:
    name: Chart
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Lets Helm push the chart to ghcr.io beside the image
      id-token: write # Lets cosign sign keylessly with this workflow's OIDC token
    env:
      # renovate: datasource=github-releases depName=helm/helm
      HELM_VERSION: v4.3.0
      CHART_REGISTRY: ghcr.io/shibernetes/charts
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      # Helm and cosign both read the Docker credentials for a registry, so one
      # login serves both.
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # The chart version and appVersion are set to the tag without its v prefix,
      # which is also the image tag that goreleaser pushes. The Artifact Hub
      # annotations get the same version.
      - name: Package and push the chart
        id: push
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=false
          if [[ "${version%%+*}" == *-* ]]; then
            prerelease=true
          fi
          IMAGE="ghcr.io/shibernetes/kem-agent:${version}" PRERELEASE="$prerelease" yq -i '
            .annotations."artifacthub.io/images" |= sub("ghcr.io/shibernetes/kem-agent:0.0.0", strenv(IMAGE)) |
            .annotations."artifacthub.io/prerelease" = strenv(PRERELEASE)
          ' deploy/chart/Chart.yaml
          helm package deploy/chart --version "$version" --app-version "$version" --destination dist
          output=$(helm push "dist/kem-agent-${version}.tgz" "oci://${CHART_REGISTRY}")
          echo "$output"
          digest=$(awk '/^Digest:/ {print $2}' <<<"$output")
          if [ -z "$digest" ]; then
            echo "::error title=Chart push::The helm push command reported no digest, so the chart can't be signed."
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign the chart
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${CHART_REGISTRY}/kem-agent@${DIGEST}"

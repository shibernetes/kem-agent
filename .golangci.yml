# yaml-language-server: $schema=https://golangci-lint.run/jsonschema/golangci.v2.jsonschema.json
version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - durationcheck
    - errname
    - errorlint
    - gocritic
    - gosec
    - intrange
    - misspell
    - noctx
    - nolintlint
    - predeclared
    - sloglint
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
  settings:
    gosec:
      config:
        # The generated config schema is a public, committed artifact.
        G306: "0644"
    sloglint:
      attr-only: true
      context: all
      key-naming-case: camel
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec
          - unparam
formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/shibernetes/kem-agent)
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
